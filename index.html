<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Posada 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Birthstone&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=WindSong:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/acceso.css" />
  </head>
  <body>
    <main class="all-contain">
      <section class="sing-up">
        <div class="card-sing-up">
          <h1 class="title-sing-up">
            ESCRIBE TU <br />
            CODIGO PARA <br />
            ENTRAR
          </h1>
          <form class="frm-sing-up" action="" id="form-acceso">
            <input
              class="psw-sing-up"
              type="text"
              id="codigo"
              autocomplete="off"
              placeholder="Escribe Aqui"
              required
            />

            <button type="submit" id="btn-entrar" class="btn-sing-up">
              ABRIR INVITACION
            </button>

            <p id="mensaje-error" role="status" aria-live="polite"></p>
          </form>
        </div>
      </section>
    </main>

    <script type="module" src="./js/acceso.js"></script>
  </body>
</html>
